version: "3.9"
services:

  #*********************************** DATABASE **********************************#
  sgd_bd:
    build: ./configs/bd
    image: sgd_bd_master:latest
    container_name: sgd_bd
    environment:
      - POSTGRES_DB=sgd_plc
      - POSTGRES_USER=sgd_plc
      - POSTGRES_PASSWORD=+S[P>Z|&8zMO,Z(5
    volumes:
      - ./data/bd/data:/var/lib/postgresql/data
      - ./data/bd/scripts:/var/lib/postgresql/scripts
      - ./data/bd/log/postgresql:/var/log/postgresql
    ports:
      - "5440:5432"
    restart: always
    networks:    
      sgd_net:
          ipv4_address: 172.168.22.2

  #*********************************** FRONT END **********************************#
  sgd_fe:
    build: ./configs/fe
    image: sgd_fe_master:latest
    container_name: sgd_fe
    volumes:
      - ./src/fe:/var/www/sgd
      - ./data/files:/var/www/sgd/storage/app/public/files
      - ./configs/fe/.env:/var/www/sgd/.env
    ports: 
      - "82:80"
    restart: always
    depends_on:
      - sgd_bd
    networks:
      sgd_net:
          ipv4_address: 172.168.22.3


  #*********************************** API GATEWAY / PROXY **********************************#
  sgd_gtw:
    build: ./configs/gtw
    image: sgd_gtw_master:latest
    container_name: sgd_gtw
    ports: 
      - "451:443"
    restart: always
    depends_on: 
      - sgd_bd
    networks:     
      sgd_net:
          ipv4_address: 172.168.22.4


  #*********************************** MICROSERVICES **********************************#            
  sgd_ms_usuarios:
    build: ./configs/ms
    image: sgd_ms_master:latest
    container_name: sgd_ms_usuarios
    expose: 
      - "3333"
    volumes:
      - ./src/ms_usuarios:/src
      - ./configs/ms/.env:/src/.env
    restart: always
    depends_on: 
      - sgd_gtw
    networks:
      sgd_net:
          ipv4_address: 172.168.22.5

    
  sgd_ms_tipos_documentos:
    build: ./configs/ms
    image: sgd_ms_master:latest
    container_name: sgd_ms_tipos_documentos
    expose: 
      - "3333"
    volumes:
      - ./src/ms_tipos_documentos:/src
      - ./configs/ms/.env:/src/.env
    restart: always
    depends_on: 
      - sgd_ms_usuarios
    networks:
      sgd_net:
          ipv4_address: 172.168.22.6


  sgd_ms_buzones:
