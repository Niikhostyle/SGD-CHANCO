  #*********************************** SWAGGER **********************************#            
  sgd_sui:
    image: swaggerapi/swagger-ui:v3.52.0
    container_name: sgd_sui
    expose:
      - "8080"
    volumes:
      - ./data/sui:/usr/share/nginx/html/definitions
    environment:
      - "BASE_URL=/api/sui"
      - "SWAGGER_JSON=/usr/share/nginx/html/definitions/sgd.json"
    depends_on: 
      - sgd_ms_usuarios
    restart: always
    networks:
      sgd_net:
          ipv4_address: 172.168.22.18

#*********************************** NETWORKS **********************************#            
networks: 
    sgd_net:
        driver: bridge
        ipam:
           driver: default
           config: 
             - subnet: 172.168.22.0/24
